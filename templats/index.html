{% extends "base.html" %}
{% block content %}
<h2 class="mb-3">Expenses</h2>

<table class="table table-hover">
  <thead>
    <tr>
      <th>ID</th>
      <th>Date</th>
      <th>Amount</th>
      <th>Category</th>
      <th>Description</th>
    </tr>
  </thead>
  <tbody>
    {% for e in expenses %}
    <tr>
      <td>{{ e[0] }}</td>
      <td>{{ e[4] }}</td>
      <td>{{ "%.2f"|format(e[1]) }}</td>
      <td>{{ e[2] }}</td>
      <td>{{ e[3] }}</td>
    </tr>
    {% else %}
    <tr>
      <td colspan="5" class="text-center text-muted">No expenses yet</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
