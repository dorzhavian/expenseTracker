{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title mb-3">Edit Expense #{{ e[0] }}</h5>
        <form method="post" action="{{ url_for('edit_save', expense_id=e[0]) }}">
          <div class="mb-2">
            <label class="form-label">Amount</label>
            <input type="number" step="0.01" class="form-control" name="amount" value="{{ e[1] }}" required>
          </div>
          <div class="mb-2">
            <label class="form-label">Category</label>
            <input type="text" class="form-control" name="category" value="{{ e[2] }}" required>
          </div>
          <div class="mb-2">
            <label class="form-label">Description</label>
            <input type="text" class="form-control" name="description" value="{{ e[3] }}">
          </div>
          <div class="mb-3">
            <label class="form-label">Date</label>
            <input type="date" class="form-control" name="date" value="{{ e[4] }}" required>
          </div>
          <div class="d-flex gap-2">
            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary w-100">Back</a>
            <button class="btn btn-primary w-100">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
