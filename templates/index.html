{% extends "base.html" %}
{% block content %}
<div class="d-flex align-items-center justify-content-between mb-3">
  <h2 class="mb-0">Expenses</h2>
  <span class="text-muted small">{{ expenses|length }} items</span>
</div>

<form method="post" action="{{ url_for('add_from_form') }}" class="row g-2 align-items-end mb-4">
  <div class="col-12 col-md-2">
    <label class="form-label">Amount</label>
    <input type="number" step="0.01" name="amount" class="form-control" placeholder="0.00" required>
  </div>
  <div class="col-12 col-md-2">
    <label class="form-label">Category</label>
    <input type="text" name="category" class="form-control" placeholder="Food" required>
  </div>
  <div class="col-12 col-md-4">
    <label class="form-label">Description</label>
    <input type="text" name="description" class="form-control" placeholder="Details...">
  </div>
  <div class="col-12 col-md-2">
    <label class="form-label">Date</label>
    <input type="date" name="date" class="form-control">
  </div>
  <div class="col-12 col-md-2">
    <button class="btn btn-primary w-100">Add</button>
  </div>
</form>

<table class="table table-hover align-middle">
  <thead class="table-light">
    <tr>
      <th>ID</th>
      <th>Date</th>
      <th>Amount</th>
      <th>Category</th>
      <th>Description</th>
      <th style="width:140px;"></th>
    </tr>
  </thead>
  <tbody>
    {% for e in expenses %}
    <tr>
      <td>{{ e[0] }}</td>
      <td>{{ e[4] }}</td>
      <td>{{ "%.2f"|format(e[1]) }}</td>
      <td><span class="badge text-bg-secondary">{{ e[2] }}</span></td>
      <td>{{ e[3] }}</td>
      <td class="text-end">
        <a href="{{ url_for('edit_page', expense_id=e[0]) }}" class="btn btn-sm btn-outline-primary">Edit</a>
        <form method="post" action="{{ url_for('delete_from_form', expense_id=e[0]) }}" class="d-inline"
              onsubmit="return confirm('Delete this expense?');">
          <button class="btn btn-sm btn-outline-danger">Delete</button>
        </form>
      </td>
    </tr>
    {% else %}
    <tr>
      <td colspan="6" class="text-center text-muted">No expenses yet</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
